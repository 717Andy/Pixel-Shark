[project]
name = "pixelshark-tracker"
version = "0.1.0"
description = "State tracker interface. Phase 0 passes observations through."
requires-python = ">=3.11"
dependencies = ["pixelshark-schema"]

[tool.uv.sources]
pixelshark-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_tracker"]
