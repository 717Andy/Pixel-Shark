[project]
name = "pixelshark-orchestrator"
version = "0.1.0"
description = "One decision cycle: perceive, track, choose, style, and point at a button."
requires-python = ">=3.11"
dependencies = ["pixelshark-schema"]

[tool.uv.sources]
pixelshark-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_orchestrator"]
