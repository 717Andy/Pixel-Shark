[project]
name = "pixelshark-sim"
version = "0.1.0"
description = "No-limit hold'em table simulator backed by PokerKit."
requires-python = ">=3.11"
dependencies = [
    "pixelshark-schema",
    "pokerkit>=0.7.7,<0.8",
]

[tool.uv.sources]
pixelshark-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_sim"]
