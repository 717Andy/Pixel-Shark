[project]
name = "pixelshark-strategy"
version = "0.1.0"
description = "Strategy interface. Phase 0 uses a scripted baseline; CFR comes later."
requires-python = ">=3.11"
dependencies = [
    "pixelshark-schema",
    "pixelshark-sim",
]

[tool.uv.sources]
pixelshark-schema = { workspace = true }
pixelshark-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_strategy"]
