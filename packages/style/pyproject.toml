[project]
name = "pixelshark-style"
version = "0.1.0"
description = "Style and instruction layer: turn a strategic action into how it is performed."
requires-python = ">=3.11"
dependencies = ["pixelshark-schema"]

[tool.uv.sources]
pixelshark-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_style"]
