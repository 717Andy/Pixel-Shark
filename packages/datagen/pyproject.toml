[project]
name = "pixelshark-datagen"
version = "0.1.0"
description = "Synthetic screenshot generator for the Pixel Shark table."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4",
    "pixelshark-device",
    "pixelshark-schema",
    "pixelshark-table",
    "playwright>=1.48",
]

[tool.uv.sources]
pixelshark-device = { workspace = true }
pixelshark-schema = { workspace = true }
pixelshark-table = { workspace = true }

[project.scripts]
pixelshark-datagen = "pixelshark_datagen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_datagen"]
