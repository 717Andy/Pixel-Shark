[project]
name = "pixelshark-executor"
version = "0.1.0"
description = "Turn a chosen poker action into a click on a labeled button."
requires-python = ">=3.11"
dependencies = ["pixelshark-schema"]

[tool.uv.sources]
pixelshark-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_executor"]
