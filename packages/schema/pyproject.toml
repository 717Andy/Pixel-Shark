[project]
name = "pixelshark-schema"
version = "0.1.0"
description = "Versioned ground-truth game-state schema for Pixel Shark."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_schema"]
