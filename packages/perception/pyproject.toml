[project]
name = "pixelshark-perception"
version = "0.1.0"
description = "Read a screenshot into the game-state schema."
requires-python = ">=3.11"
dependencies = [
    "pixelshark-schema",
    "pixelshark-sim",
]

[project.scripts]
pixelshark-perceive = "pixelshark_perception.cli:main"

[tool.uv.sources]
pixelshark-schema = { workspace = true }
pixelshark-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_perception"]
