[project]
name = "pixelshark-perception"
version = "0.1.0"
description = "Perception interface. Phase 0 has no model; a VLM reader comes later."
requires-python = ">=3.11"
dependencies = ["pixelshark-schema"]

[tool.uv.sources]
pixelshark-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelshark_perception"]
